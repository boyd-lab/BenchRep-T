[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchrep-t"
version = "0.1.0"
description = "Benchmarking framework for TCR repertoire-based disease classification"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.24,<1",
    "numpy>=1.23.5,<3",
    "pandas>=1.5,<4",
    "scipy>=1.10,<2",
    "scikit-learn>=1.2,<2",
    "tqdm>=4.66,<5",
]

[project.scripts]
benchrep-download-data = "utils.huggingface_data:main"

[project.optional-dependencies]
# Statistical and feature-engineered methods
base = [
    "biopython>=1.83,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
    "xgboost>=2,<4",
]
# GIANA clustering model
giana = [
    "biopython>=1.83,<2",
    "faiss-gpu-cu12==1.8.0.2",
]
# Attention-based MIL model (requires PyTorch)
abmil = [
    "torch>=2.3,<3",
    "transformers>=4.41,<5",
]
# DeepRC model and its upstream utilities
deeprc = [
    "deeprc @ https://github.com/ml-jku/DeepRC/archive/108d08d8cf2d2d69eb3f6caef1aa04d624dec871.tar.gz",
    "widis-lstm-tools @ https://github.com/widmi/widis-lstm-tools/archive/c0aa852341445b8c51071c9b5aad01d579df96f5.tar.gz",
    "torch>=2.3,<3",
    "h5py>=3.8,<4",
    "tensorboard>=2.12,<3",
    "dill>=0.3.6,<1",
    "matplotlib>=3.7,<4",
]
# DeepTCR model (requires TensorFlow)
deeptcr = [
    "tensorflow[and-cuda]==2.15.1",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "scipy==1.10.1",
    "scikit-learn==1.2.2",
    "umap-learn==0.5.5",
    "logomaker==0.8",
    "distinctipy==1.2.1",
    "h5py==3.8.0",
    "biopython==1.76",
    "matplotlib==3.7.2",
    "seaborn==0.12.2",
]
# Mal-ID-Lite model (git submodule at models/Mal-ID-Lite)
mal-id-lite = [
    "torch>=2.3,<3",
    "fair-esm>=2,<3",
    "python-glmnet>=2.6,<3",
    "joblib>=1.5,<2",
    "pyarrow>=15,<24",
]
# Driver sequence identification experiment
drivers = [
    "python-Levenshtein",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evals*", "models*", "utils*"]
namespaces = true
