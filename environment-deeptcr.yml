name: deeptcr
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - huggingface-hub==0.36.0
      - numpy==1.23.5
      - pandas==1.5.3
      - scipy==1.10.1
      - scikit-learn==1.2.2
      - tqdm==4.66.4
      - biopython==1.76
      - matplotlib==3.7.2
      - seaborn==0.12.2
      # The CUDA extra supplies a matched CUDA 12 runtime, cuDNN, and ptxas.
      # TensorFlow 2.15 retains the v1 compatibility APIs used by DeepTCR and
      # has been validated on an NVIDIA H200 (compute capability 9.0).
      - tensorflow[and-cuda]==2.15.1
      - umap-learn==0.5.5
      - logomaker==0.8
      - distinctipy==1.2.1
      - h5py==3.8.0
